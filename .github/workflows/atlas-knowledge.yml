name: AI Infra Atlas checks
on:
  pull_request:
    paths: ['projects/ai-cluster-3d/**', '.github/workflows/atlas-knowledge.yml']
  push:
    branches: [main]
    paths: ['projects/ai-cluster-3d/**', '.github/workflows/atlas-knowledge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/ai-cluster-3d
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate data, geometry and bookmark storage adapter
        run: |
          node tests/structure.test.cjs
          node tests/software.test.cjs
          python scripts/validate.py
          python scripts/build.py
      - name: Install browser test dependency
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test live browser and same-origin localStorage
        env:
          ATLAS_TEST_HTTP: '1'
          ATLAS_TEST_CHROMIUM: 'bundled'
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-results
          path: |
            projects/ai-cluster-3d/tests/browser-results.json
            projects/ai-cluster-3d/tests/screens/*.png
