<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="可分层展开的算力集群三维资源图谱：机房、线缆、计算、互联以及原理与故障映射。"><title>算力资源图谱 · 3D结构与故障映射</title><link rel="stylesheet" href="src/style.css"></head><body>
<header class="topbar"><div class="brand"><div class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><strong>算力资源图谱</strong><small>RESOURCE × PROTOCOL × FAILURE</small></div></div><div class="top-meta"><span class="badge teal">硬件资源侧</span><span class="badge">47 资源节点</span><span class="badge orange">95 条故障说明</span></div><div class="top-actions"><button class="mobile-nav-button" id="nav-toggle" aria-label="打开资源导航">资源</button><button class="primary" id="open-catalog">故障目录 <span class="desktop-only">／</span></button><button class="quiet desktop-only" id="open-help">操作与来源</button></div></header>
<div class="workspace"><aside class="nav" id="nav"><div class="nav-header"><div class="eyebrow">01 / RESOURCE EXPLORER</div><h2>从设施到计算域</h2><div class="search-wrap"><input id="resource-search" type="search" placeholder="搜索资源、缩写或故障" aria-label="搜索资源"></div></div><nav class="resource-tree" id="resource-tree" aria-label="资源层级"></nav><footer class="nav-footer"><span class="dotmark">●</span> 知识记录 · 非实时告警<br>编号计数代表关联说明数量。<br>不同平面的同名记录独立保存。</footer></aside>
<main class="scene-column"><div class="scene-head"><nav class="breadcrumb" id="breadcrumb" aria-label="当前资源路径"></nav><div class="scene-title-row"><h1 id="scene-title"></h1><span class="level-name" id="scene-en"></span></div><div class="profile-row"><label for="profile-select">产品视角</label><select id="profile-select"></select><button class="profile-info" id="profile-info">规格与边界 ↗</button></div></div><div class="stage"><canvas id="scene-canvas" aria-label="可旋转、缩放和点击展开的三维资源模型" tabindex="0"></canvas><div class="labels" id="labels"></div><div class="stage-meta"><div><div class="stage-kicker" id="scene-profile"></div><div class="render-status" id="render-status"></div></div><div class="stage-boundary" id="scope-chip">结构示意 · 非实物CAD</div></div><div class="stage-hint"><div class="legend-items"><span style="--c:#35cbb7">计算</span><span style="--c:#80a8db">内存</span><span style="--c:#a18bef">总线</span><span style="--c:#e6b567">网络</span><span style="--c:#51abeb">冷却</span></div><div class="gesture">拖动旋转 · 滚轮缩放 · 点击部件深入</div></div></div><div class="scene-controls"><div class="control-group"><button data-view="iso" title="恢复等轴观察角度">等轴</button><button data-view="top">俯视</button><button data-view="front">正视</button></div><div class="explode-control"><label for="explode">部件展开</label><input id="explode" type="range" min="0" max="100" value="0"><output id="explode-value" for="explode">0%</output></div><div class="control-group"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="reset-scene">复位</button></div></div><div class="scene-note" id="scene-note"></div><div class="mini-explore"><div class="caption">继续深入 · 可点击三维部件或以下入口</div><div class="part-links" id="part-links"></div></div></main>
<aside class="detail" id="detail-panel"><div class="detail-header"><div class="detail-kicker">02 / RESOURCE DETAILS <span class="badge teal" id="detail-level"></span></div><h2 id="detail-title"></h2><div class="en" id="detail-en"></div></div><div class="tabs" role="tablist" aria-label="资源说明视图"><button class="tab active" data-tab="resource" role="tab">资源</button><button class="tab" data-tab="protocol" role="tab">承载协议</button><button class="tab" data-tab="faults" role="tab">故障 <span class="small-count" id="fault-tab-count"></span></button><button class="tab" data-tab="compare" role="tab">厂商对照</button><button class="tab" data-tab="sources" role="tab">来源</button></div><div class="detail-scroll" id="detail-content" role="tabpanel"></div></aside></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><section class="modal-card" id="modal-card"><div class="modal-header"><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button class="close" id="modal-close" aria-label="关闭对话框">×</button></div><div class="modal-controls" id="modal-controls"></div><div class="modal-body" id="modal-body"></div><div class="modal-footer" id="modal-footer"></div></section></div><div class="toast" id="toast" hidden role="status"></div>
<script src="data/resources.js"></script>
<script src="data/faults.js"></script>
<script src="data/profiles.js"></script>
<script src="data/sources.js"></script>
<script src="data/groups.js"></script>
<script src="src/engine.js"></script>
<script src="src/models.js"></script>
<script src="src/app.js"></script></body></html>
